<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Panel de Moderación</title>

    <style>

    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 40px;
        max-width: 1400px;
        margin: 0 auto;
    }

    h1 {
        margin-bottom: 30px;
    }

    h2 {
        margin-top: 40px;
        margin-bottom: 20px;
    }

    /* =========================
    MENSAJES
    ========================= */

    #messages {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* =========================
    FOTOS
    ========================= */

    #fotos {
        display: grid;
        grid-template-columns: repeat(
            auto-fill,
            minmax(350px, 1fr)
        );
        gap: 20px;
    }

    /* =========================
    VIDEOS
    ========================= */

    #videos {
    display: grid;
    grid-template-columns: repeat(
        auto-fill,
        minmax(350px, 1fr)
    );
    gap: 20px;
    }

    .video-preview {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
        margin: 15px 0;
        border: 1px solid #ddd;
    }

    /* =========================
    CARDS
    ========================= */

    .message-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 12px rgba(0,0,0,.08);
        transition: transform .2s ease;
    }

    .message-card:hover {
        transform: translateY(-2px);
    }

    .message-card h3 {
        margin-top: 0;
        margin-bottom: 10px;
    }

    .message-card p {
        margin: 8px 0;
    }

    /* =========================
    IMAGENES
    ========================= */

    .photo-preview {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
        margin: 15px 0;
        border: 1px solid #ddd;
    }

    /* =========================
    BOTONES
    ========================= */

    .action-buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    button {
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    .approve-btn {
        background: #22c55e;
        color: white;
    }

    .approve-btn:hover {
        background: #16a34a;
    }

    .reject-btn {
        background: #ef4444;
        color: white;
    }

    .reject-btn:hover {
        background: #dc2626;
    }

    small {
        color: #666;
    }

    </style>

</head>

<body>

    <h1>Peticiones Pendientes</h1>

    <h2>Mensajes</h2>

    <div id="messages"></div>

    <h2>Fotos</h2>

    <div id="fotos"></div>

    <h2>Videos</h2>

    <div id="videos"></div>

    <script type="module" src="scripts/analytics.js"></script>
    <script src="scripts/admin.js"></script>

</body>
</html>
