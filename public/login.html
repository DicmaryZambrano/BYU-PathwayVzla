<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Inicio de Sesión de Admin</title>

    <style>

        body {
            font-family: Arial;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
        }

        h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            cursor: pointer;
        }

        #error {
            color: red;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Inicio de Sesión de Admin</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Inicia Sesión
        </button>

        <p id="error"></p>

    </div>

    <script type="module" src="scripts/analytics.js"></script>
    <script src="scripts/login.js"></script>

</body>
</html>
